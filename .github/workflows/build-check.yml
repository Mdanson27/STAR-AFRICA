name: Star Africa Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: starafrica
          POSTGRES_PASSWORD: starafrica
          POSTGRES_DB: starafrica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U starafrica -d starafrica_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      STAR_AFRICA_MODE: 'production-test'
      STAR_AFRICA_SECURITY_SECRET: 'ci-only-production-security-secret-not-used-outside-tests'
      DATABASE_URL: postgresql://starafrica:starafrica@127.0.0.1:5432/starafrica_test
      DATABASE_URL_UNPOOLED: postgresql://starafrica:starafrica@127.0.0.1:5432/starafrica_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Bootstrap Postgres schema
        shell: bash
        run: |
          set +e
          npm run db:bootstrap 2>&1 | tee bootstrap.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-bootstrap-log
          path: bootstrap.log
          if-no-files-found: ignore

      - name: Production build
        run: npm run build
